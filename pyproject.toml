[project]
name = "fetchgraph"
version = "0.3.0"
description = "Evidence-first retrieval from configured data providers for agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT" 
authors = [{name = "Alexander Onischenko"}]
keywords = ["agents", "context", "langgraph", "planning", "llm"]
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.0",
]

[tool.setuptools.package-data]
fetchgraph = ["prompts/*.md", "mcp/tools.json"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
retrieval = ["httpx>=0.27", "jsonschema>=4", "PyYAML>=6"]
mcp = ["fetchgraph[retrieval]==0.3.0", "mcp>=1.30,<2"]
dev = [
  "pytest>=9.0",
  "pre-commit",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "ruff",
  "pyright",
  "build",
  "twine"
]
demo = [
  "pydantic-settings>=2.12",
  "python-dotenv>=1.0",
  "openai"
]

[project.urls]
Homepage = "https://github.com/AlexanderOnischenko/fetchgraph"
Repository = "https://github.com/AlexanderOnischenko/fetchgraph"
Documentation = "https://github.com/AlexanderOnischenko/fetchgraph#readme"
Issues = "https://github.com/AlexanderOnischenko/fetchgraph/issues"

[project.scripts]
fetchgraph-tracer = "fetchgraph.tracer.cli:main"
fetchgraph-artifact-context = "fetchgraph.cli.artifact_context:main"
fetchgraph-mcp = "fetchgraph.mcp.server:main"
